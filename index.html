<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="백엔드 개발자 구지훈의 포트폴리오 — Spring Boot, 동시성 제어, 실시간 시스템" />
    <!--
      OG 태그 — 배포 당일 처리 목록:
      1. og:url 추가: <meta property="og:url" content="https://배포도메인/" />
      2. og:image 추가: 1200×630 가로 썸네일(이름 + 한 줄 소개)을 만들어 public/og.png로 두고
         절대 URL로 지정: <meta property="og:image" content="https://배포도메인/og.png" />
         (OG 크롤러는 상대 경로를 해석하지 못하므로 반드시 절대 URL이어야 합니다)
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="구지훈 | 백엔드 개발자 포트폴리오" />
    <meta
      property="og:description"
      content="동작하는 코드에서 멈추지 않습니다 — Redis 동시성 제어, Spring Security 인증 설계, 트러블슈팅 과정을 기록한 포트폴리오"
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <title>구지훈 | 백엔드 개발자 포트폴리오</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
